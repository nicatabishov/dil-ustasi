name: Yayınla
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3,15 * * *'   # günde iki kez: haber ve hikâye bölümlerini yenile
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Podcast bölümlerini güncelle
        run: node tools/build-podcasts.mjs || echo "podcast güncellemesi atlandı"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
